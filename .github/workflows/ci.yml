name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single required check for the master ruleset. Keep the job name stable;
  # add new checks as steps here (or as jobs listed in `needs`).
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Detect app code
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet: docs-only repository, nothing to check."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.app == 'true'

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.app == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Format
        if: steps.detect.outputs.app == 'true'
        run: pnpm run --if-present format:check

      - name: Lint
        if: steps.detect.outputs.app == 'true'
        run: pnpm run --if-present lint

      - name: Typecheck
        if: steps.detect.outputs.app == 'true'
        run: pnpm run --if-present typecheck

      - name: Unit and content tests
        if: steps.detect.outputs.app == 'true'
        run: pnpm run --if-present test

      - name: Build
        if: steps.detect.outputs.app == 'true'
        run: pnpm run --if-present build
