name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single required check for the master ruleset. Keep the job name stable;
  # add new checks as steps here (or as jobs listed in `needs`).
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run --if-present format:check

      - name: Lint
        run: pnpm run --if-present lint

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Unit and content tests
        run: pnpm run --if-present test

      - name: Build
        run: pnpm run --if-present build

      - name: Install Playwright browser
        run: pnpm --filter @chess-kids/web exec playwright install --with-deps chromium

      - name: E2E smoke test
        run: pnpm run test:e2e
        env:
          CI: true
