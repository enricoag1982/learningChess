rook:
  title: Meet the Rook
  story: >-
    The rook moves in straight lines: up, down, left, or right, as far as it likes. It can never
    jump over another piece.
  demo: Watch the rook go to every green dot. Straight lines, any distance!
rook-g1: Move the rook straight up to the star.
rook-g2: Move the rook straight across to the star.
rook-01: Help the rook grab both stars in the corners.
rook-02: Collect every star. Plan the rook's path first!
rook-03: Tap every square the rook can reach from here.
rook-04: A rock blocks the way! Find another path to the star.
rook-05: The rook is hungry. Gobble up the pawn!
rook-06: A friend blocks one line, a pawn waits on another. Tap every square the rook can reach.
rook-07: Three pawns, three captures. Get them all!
rook-08: The rook's biggest challenge yet. Collect every star around the rock.
rook-04-easy: A rock blocks the way! Go around it to reach the star.
rook-08-easy: Collect both stars. The rock is in the way!
hungry-rook:
  title: Hungry Rook
  goal: The rook is starving! Capture every piece before the moves run out.
bishop:
  title: Meet the Bishop
  story: >-
    The bishop only moves on diagonal paths, but it can go as far as it likes! It always stays on
    squares of one colour.
  demo: Watch the bishop go to every green dot. Diagonal paths, any distance!
bishop-g1: Move the bishop diagonally to the star.
bishop-g2: Move the bishop the other diagonal way to the star.
bishop-01: Help the bishop grab both stars, corner to corner.
bishop-02: Collect every star. Plan the bishop's diagonal path first!
bishop-03: The bishop only visits squares of one colour. Can it reach the star?
bishop-04: Tap every square the bishop can reach. Look — they're all the same colour!
bishop-05: A rock blocks the diagonal! Find another way to the star.
bishop-06: The bishop is hungry. Gobble up the pawn!
bishop-07: A rock blocks one path, a pawn waits on another. Tap every square the bishop can reach.
bishop-08: The bishop's biggest challenge yet. Capture all four pawns.
bishop-08-easy: Capture both pawns on the bishop's diagonals.
hungry-bishop:
  title: Hungry Bishop
  goal: The bishop is starving! Capture every piece before the moves run out.
queen:
  title: Meet the Queen
  story: >-
    The queen combines the rook's straight lines and the bishop's diagonal paths. It is the
    strongest piece on the board!
  demo: Watch the queen go to every green dot. Straight lines and diagonals, any distance!
queen-g1: Move the queen straight up to the star.
queen-g2: Move the queen straight across to the star.
queen-01: Help the queen grab both stars in the corners.
queen-02: One swift diagonal move reaches the far star!
queen-03: Tap every square the queen can reach from here.
queen-04: A rock blocks the way! Find another path to the star.
queen-05: The queen is hungry. Gobble up the pawn!
queen-06: A friend blocks one line, a pawn waits on another. Tap every square the queen can reach.
queen-07: Three pawns, three captures. Get them all!
queen-08: The queen's biggest challenge yet. Collect every star around the rock.
queen-08-easy: Collect both stars in the corners below.
hungry-queen:
  title: Hungry Queen
  goal: The queen is starving! Capture every piece before the moves run out.
king:
  title: Meet the King
  story: >-
    The king is the most important piece of all! It only steps one square at a time, in any
    direction, and it must always stay safe.
  demo: Watch the king take one careful step in every direction.
king-g1: Move the king one step up to the star.
king-g2: Move the king one step to the star.
king-01: Walk the king to the star, one step at a time.
king-02: Tap every square the king can step to.
king-03: A pawn is watching a square! Find a safe path to the star.
king-04: Tap only the squares where the king is safe.
king-05: A pawn blocks the direct path. Find the safe way to the star.
king-06: The king's longest walk yet. Stay safe all the way to the star.
king-06-easy: A short walk this time. Stay safe on the way to the star.
king-walk:
  title: King Walk
  goal: The king must reach both stars, one careful step at a time, always staying safe.
knight:
  title: Meet the Knight
  story: >-
    The knight jumps in an L shape: two squares one way, then one more to the side. It can jump
    right over anyone standing in between!
  demo: Watch the knight jump to every green dot. Always an L shape!
knight-g1: Jump the knight to the star.
knight-g2: Jump the knight to the star.
knight-01: Jump the knight to the star.
knight-02: Rocks are in the way, but the knight jumps right over them!
knight-03: Tap every square the knight can jump to.
knight-04: The knight is hungry. Gobble up the pawn!
knight-05: A rock blocks one landing spot. Tap every square the knight can jump to.
knight-06: The knight is boxed in by rocks, but knights jump right over them!
knight-07: Two jumps, two captures. Get them both!
knight-08: Collect both stars. Plan the knight's jumps!
knight-08-easy: Collect both stars. Just two quick jumps!
knight-maze:
  title: Knight Maze
  goal: The knight must collect every star by jumping over the rocks!
pawn:
  title: Meet the Pawn
  story: >-
    The pawn only moves straight ahead, never sideways or back. On its very first move it can go
    one square or two — after that, always just one. To capture, it steps diagonally forward
    instead, never straight ahead.
  demo: Watch the pawn move forward. On its very first step it can go one square or two!
pawn-g1: Move the pawn forward, one square, to the star.
pawn-g2: On its very first move, the pawn can go two squares. Reach the star!
pawn-01: Move the pawn to the star. Its first move can go one square or two!
pawn-02: The pawn already made its first move. Now it moves one square at a time. Reach the star.
pawn-03: Something blocks your pawn's path straight ahead. Tap every square it can still reach.
pawn-04: Your pawn can only capture on a diagonal, never straight ahead. Find the piece it can capture.
pawn-05: Your pawn is blocked straight ahead, but it can still capture on either diagonal. Tap every square it can reach.
pawn-06: A piece waits on the diagonal. Capture it, then keep going to the star!
pawn-07: Two pieces stand in your pawn's way. Move closer, then capture them both!
pawn-08: Collect the first star, then find a way around the blocker to reach the second!
pawn-08-easy: Capture the pawn, then reach the star!
pawn-wars-4:
  title: Pawn Wars Jr.
  goal: Four pawns each! Be the first to transform into a queen, or capture every enemy.
promotion:
  title: The Pawn Transforms!
  story: >-
    When a pawn reaches the very last row, something amazing happens: it transforms into a
    brand-new piece! It can become a queen, a rook, a bishop, or a knight — the powerful queen is
    almost always the best choice.
  demo: Watch the pawn move all the way to the last row. There, it transforms!
promotion-g1: One more step and the pawn transforms! Move it to the last row.
promotion-g2: The pawn is about to transform! Which piece should it become?
promotion-01: One more step and the pawn transforms! Move it to the last row.
promotion-02: The pawn is about to transform! Which piece should it become?
promotion-03: A knight blocks the square ahead, but the pawn can capture its way to the last row. Find the winning move!
promotion-04: Tap every square where the pawn could transform this move.
promotion-05: Look at the pawn. Is it about to transform into a new piece?
promotion-03-easy: Move the pawn to the last row. Push forward, or capture the rook — either way it transforms!
pawn-wars:
  title: Pawn Wars
  goal: Eight pawns each! Race to transform first, or capture every piece.
squares:
  title: Meet the Squares
  story: >-
    Every chessboard is a checkerboard: light squares and dark squares, side by side. Here's Owl's
    favourite trick — the corner near your right hand is always light!
  demo: Look at your two corners. The one near your right hand is light. The one near your left hand is dark.
squares-g1: Your king is standing in your right-hand corner. Is that square light?
squares-g2: Now he hopped to your left-hand corner. Is that square light?
squares-01: Now he went to the far corner on your right. Is that square light?
squares-02: He hopped all the way to the far corner on your left. Is that square light?
squares-03: Now he's out in the middle of the board. Is his square light?
squares-04: Tap every light square in the bottom row, the one nearest you.
squares-05: Now tap every dark square in that bottom row.
squares-05-easy: Tap the dark square in the bottom-left corner.
lines:
  title: Rows, Columns, and Diagonals
  story: >-
    A row runs from side to side, a column runs from you to Owl, and a diagonal runs on a slant,
    like stairs. Most squares sit on two diagonals, one leaning each way. Every line is straight,
    and every square on it belongs together!
  demo: See this whole row, edge to edge? Every square on it is part of the same line.
lines-g1: Tap every square in the same row as your king.
lines-g2: Tap every square in the same column as your king.
lines-01: Tap every square in your king's row.
lines-02: This time, tap every square in your king's column.
lines-03: Your king moved closer to you. Tap his whole row.
lines-04: Tap every square in your king's column, all the way across the board.
lines-05: Your king is in a corner, so he sits on just one diagonal. Tap every square on it.
lines-06: Now your king sits on two diagonals. Tap every square of the long one, from corner to corner.
lines-06-easy: Your king sits on two diagonals. Tap every square of the short one.
square-hunt:
  title: Square Hunt
  goal: Tap every square in each highlighted line, as fast as you can!
square-hunt-r1: Tap every square in your king's row.
square-hunt-r2: Tap every square in your king's column.
square-hunt-r3: Tap every square in your king's row.
square-hunt-r4: Tap every square in your king's column.
square-hunt-r5: Tap every square on the long diagonal through your king, from corner to corner.
square-hunt-r6: Now the other long diagonal through your king. Tap it from corner to corner.
setup:
  title: Setting Up the Board
  story: >-
    Every game starts the same way. Rooks stand in the corners, knights right beside them, then
    bishops, and the queen and king share the middle. Pawns line up in front to protect them all.
  demo: Here is the whole starting line-up, ready to play.
setup-g1: "Let's start easy. Place the king on the dark square in the middle of the back row."
setup-g2: Now put the queen right next to him, on his left side.
setup-01: Place both rooks in their corners.
setup-02: Now add the knights, right next to the rooks.
setup-03: Next come the bishops, next to the knights.
setup-04: >-
  Finally the queen and king share the middle. Remember: the queen always stands on a square of
  her own colour!
setup-05: All that's left is the pawns — line up all eight, standing guard in front.
setup-05-easy: Add four pawns, one in front of each piece on the left, from the rook to the queen.
setup-race:
  title: Setup Race
  goal: Race to place every piece in its starting spot!
setup-race-r1: Place every piece on the back row, all in their starting spots.
setup-race-r2: Now add all eight pawns, standing guard in front.
attack:
  title: What Does It Attack?
  story: >-
    A piece "attacks" every square it could capture on right now, even the empty ones! Before you
    move, Owl wants you to spot every attack on the board.
  demo: Watch the pawn. It attacks both diagonal squares in front of it!
attack-g1: Tap every square the pawn attacks.
attack-g2: Your knight wants to attack the bishop on d4. Which move lets it do that?
attack-01: Tap every square the pawn attacks — the knight and the bishop are both there.
attack-02: Your knight jumps in an L. Tap every square it attacks from d4 — some are empty, some have pieces!
attack-03: The rook attacks in straight lines. Tap every square it attacks from d1.
attack-04: Move your knight so it attacks the bishop on c4.
attack-05: Move your rook so it attacks the knight on d4.
attack-06: Move your bishop so it attacks the knight on a5.
attack-07: Your knight has more than one jump. Which move attacks the rook on b5?
attack-08: Your queen is very powerful. Find a move that attacks the knight on f6.
defend:
  title: Defend Your Pieces
  story: >-
    When an enemy attacks your piece, you can move it away, bring a friend to guard it, block the
    attack, or capture the attacker. Owl calls all of these "defending"!
  demo: The black rook is coming for your knight! The knight can hop away to safety, or a friend could guard it.
defend-g1: Is your knight defended by the pawn on c3?
defend-g2: The black rook is coming for your knight! Move the knight to safety.
defend-01: 'Is the knight on d5 defended?'
defend-02: 'A pawn now guards d5. Is the knight defended?'
defend-03: The black rook is attacking your knight. Is your knight defended by the white rook on d2?
defend-04: The black rook is coming for your knight on b5! Move the knight to safety.
defend-05: Your knight (a1) is trapped and the black rook is attacking it! Move your bishop so it guards the knight.
defend-06: Your knight (a1) still can't move. Save it — block the attack, or capture the attacking rook!
defend-07: The black rook is attacking your bishop. Move the bishop to safety.
defend-08: The bishop on c3 is attacking your rook! Move your knight to capture it.
safe-pieces:
  title: Safe or Not?
  story: >-
    A piece is "hanging" when it is attacked and nothing protects it — the enemy could take it for
    free! Owl's #1 safety habit is always asking, "Is my piece safe?"
  demo: Look at your knight. The black rook attacks it and nothing guards it — the knight is hanging!
safe-pieces-g1: Is your knight hanging?
safe-pieces-g2: The black pawn is undefended. Capture it for free!
safe-pieces-01: The bishop (black) attacks your knight and nothing guards it. Is your knight hanging?
safe-pieces-02: A pawn now guards your knight. Is it still hanging?
safe-pieces-03: Nothing attacks your bishop. Is it hanging?
safe-pieces-04: The knight (black) attacks your pawn and nothing guards it. Is your pawn hanging?
safe-pieces-05: The rook (black) attacks your rook on a4, but your other rook guards it. Is your rook on a4 hanging?
safe-pieces-06: The knight (black) attacks your queen and nothing guards it. Is your queen hanging?
safe-pieces-07: The bishop (black) is undefended. Capture it for free with your queen!
safe-pieces-08: Two pawns (black) are waiting. Only one is undefended — capture that one for free!
safe-pieces-09: Two pieces (black) are undefended. Find a move that captures one for free.
safe-pieces-10: One rook (black) is undefended, the other is guarded. Capture the free one!
piece-values:
  title: How Much Is Each Piece Worth?
  story: >-
    Every piece has a value: a pawn is worth 1, a knight and a bishop are worth 3, a rook is worth
    5, and the queen is worth a mighty 9! Knowing this helps you decide if a trade is worth it.
  demo: 'Here they are in order: pawn 1, knight or bishop 3, rook 5, queen 9.'
piece-values-g1: 'Which is worth more: the pawn or the rook?'
piece-values-g2: 'Which is worth more: the knight or the queen?'
piece-values-01: 'Which is worth more: the pawn or the knight?'
piece-values-02: 'Which is worth more: the bishop or the rook?'
piece-values-03: 'Which is worth more: the rook or the queen?'
piece-values-04: Which piece is worth exactly 5?
piece-values-05: Which piece is worth exactly 9?
piece-values-06: Which piece is worth exactly 1?
trades:
  title: Good Trade or Bad Trade?
  story: >-
    Before you capture, ask what you give up and what you get. Taking a bigger piece, or an
    undefended one, is good — losing more than you gain is bad!
  demo: Your rook captures the queen! You give up a rook (worth 5) to win a queen (worth 9) — a great trade!
trade-good: Good trade
trade-equal: Equal trade
trade-bad: Bad trade
trades-g1: Your rook captures the queen on h1. Is this trade good, equal, or bad?
trades-g2: The knight (black) is undefended. Capture it with your bishop — a free piece is always a good trade!
trades-01: Your knight captures the rook on d5, even though a pawn guards it. Good, equal, or bad trade?
trades-02: The pawn on h1 is guarded by a knight. If your rook captures it, good, equal, or bad trade?
trades-03: The rook on h1 is guarded by a knight. If your rook captures it, good, equal, or bad trade?
trades-04: The pawn on f4 is undefended. If your bishop captures it, good, equal, or bad trade?
trades-05: The pawn on c3 is guarded by another pawn. If your knight captures it, good, equal, or bad trade?
trades-06: The knight on c3 is guarded by a pawn. If your knight captures it, good, equal, or bad trade?
trades-07: 'Find the good trade: capture a piece worth more than your rook.'
trades-08: Your bishop can capture two different pieces. Find a good trade.
queen-vs-pawns:
  title: Queen vs Pawns
  goal: The queen must capture every pawn before one of them transforms!
army-battle:
  title: Army Battle
  goal: Pawns and knights on both sides! Capture every enemy piece, or be first to transform.
win-the-queen:
  title: Win the Queen
  goal: No kings today — the first side to capture the enemy queen wins!
safe-or-not:
  title: Safe or Not?
  goal: 'Ten pieces, ten questions: is each one safe, or in danger?'
safe-or-not-r1: 'Is the bishop on e4 in danger?'
safe-or-not-r2: 'A pawn now guards the bishop on e4. Is it in danger?'
safe-or-not-r3: 'Nothing attacks the knight on h4. Is it in danger?'
safe-or-not-r4: 'Is the pawn on a7 in danger?'
safe-or-not-r5: 'A rook now guards the pawn on a7. Is it in danger?'
safe-or-not-r6: 'Is the knight on d4 in danger?'
safe-or-not-r7: 'A pawn now guards the knight on d4. Is it in danger?'
safe-or-not-r8: 'Is the rook on a1 in danger?'
safe-or-not-r9: 'A bishop now blocks the attack on a1. Is the rook in danger?'
safe-or-not-r10: 'Is the queen on f4 in danger?'
check:
  title: What Is Check?
  story: >-
    When a king is attacked, that's CHECK — danger! Your king must get to safety right away. Owl
    will teach you to spot it, and how to give check yourself.
  demo: A check! The black rook attacks your king along the open file.
check-g1: Is your king in check from the black rook?
check-g2: Your rook can give check! Find the move that attacks the black king.
check-01: A black bishop attacks your king along the diagonal. Is your king in check?
check-02: A pawn now blocks the diagonal. Is your king in check?
check-03: A black knight jumps into position to attack your king. Is your king in check?
check-04: A black rook sits on a different line, far from your king. Is your king in check?
check-05: Move your rook so it gives check to the black king.
check-06: Move your bishop so it gives check to the black king.
check-07: Your queen can check the black king in several ways. Find one!
check-08: Move your knight so it gives check to the black king.
escape-check:
  title: Escape the Check!
  story: >-
    When your king is in check, there are 3 ways out: move it to safety, block the attack, or
    capture the attacker. Let's practise all three!
  demo: Your king is in check. Every green dot is a square where it would be safe.
escape-check-g1: Your king is in check! Tap every square where it can escape.
escape-check-g2: The only way out is to move your king — find a safe square.
escape-check-01: Your king is in check from the rook. Tap every square where it is safe.
escape-check-02: Your king is in check from the bishop. Tap every square where it is safe.
escape-check-03: Your king is in check from the rook. Tap every safe square for it.
escape-check-04: Your king is in check from a bishop far away. Tap every safe square for it.
escape-check-05: A knight's check can never be blocked! Move your king to safety.
escape-check-06: Move your king out of check — nothing can block or capture this rook here.
escape-check-07: Block the check! Move your bishop between your king and the rook.
escape-check-08: Block the check! Move your rook between your king and the bishop.
escape-check-09: Capture the checking knight!
escape-check-10: The bishop giving check isn't guarded. Capture it with your king!
checkmate:
  title: Check or Checkmate?
  story: >-
    Checkmate means the king is in check AND has no way out at all — no move, no block, no
    capture. The game is won!
  demo: Checkmate! The queen checks the king, and every square around it is covered.
checkmate-g1: 'Is the black king checkmated?'
checkmate-g2: 'Is the black king checkmated? Look for an escape.'
checkmate-01: 'The white rook checks along the back row. Is the black king checkmated?'
checkmate-02: 'The white rook checks along the back row, but there is a gap. Is the black king checkmated?'
checkmate-03: 'Two white rooks trap the black king. Is he checkmated?'
checkmate-04: 'One white rook checks the black king. Is he checkmated?'
checkmate-05: 'The white queen and king work together. Is the black king checkmated?'
checkmate-06: 'A white rook checks the black king from far away. Is he checkmated?'
checkmate-07: 'The white queen checks, guarded by her king. Is the black king checkmated?'
checkmate-08: 'The white queen checks, but nothing guards her. Is the black king checkmated?'
mate-in-1:
  title: Mate in 1
  story: >-
    Owl challenges you to deliver CHECKMATE in just one move! Look for a move that traps
    the king completely.
  demo: Checkmate in one! Your rook delivers check along the open file.
mate-in-1-g1: Find the checkmate in one move — look at your rook's path to the back row.
mate-in-1-g2: Find the checkmate in one move — your queen and king work together.
mate-in-1-01: Checkmate in one! The black king is trapped by his own pawns.
mate-in-1-02: Checkmate in one! Find the move along the open file.
mate-in-1-03: Checkmate in one! Your queen can reach the back row.
mate-in-1-04: Checkmate in one! Your queen and king team up.
mate-in-1-05: Checkmate in one! Move your queen right next to the black king.
mate-in-1-06: Checkmate in one! Your king guards your queen's checking square.
mate-in-1-07: Checkmate in one! Two rooks trap the black king together.
mate-in-1-08: Checkmate in one! One rook cuts off the escape, the other delivers check.
mate-in-1-09: Checkmate in one! Your king guards the squares your rook can't reach.
mate-in-1-10: Checkmate in one! Your king and rook trap the black king in the corner.
mate-in-1-11: Checkmate in one! Your knight guards the squares for your queen.
mate-in-1-12: Checkmate in one! Your knight and pawn guard the black king's escape.
stalemate:
  title: Watch Out for Stalemate!
  story: >-
    Stalemate is tricky: the king has no legal move at all, but he isn't in check. That's
    not a win — it's a draw! Always check before you play the "obvious" move.
  demo: Careful! The black king has no move and isn't in check — that's stalemate, a draw.
stalemate-g1: 'Is the black king stalemated?'
stalemate-g2: Find the checkmate in one move.
stalemate-01: 'The black king has no moves, and he is not in check. Is he stalemated?'
stalemate-02: 'The black king has no moves, and he is not in check. Is he stalemated?'
stalemate-03: 'The black king has plenty of moves. Is he stalemated?'
stalemate-04: 'The black king is in check, but he can escape. Is he stalemated?'
stalemate-05: Checkmate in one — but careful, some moves would stalemate instead!
stalemate-06: Checkmate in one — but careful, some moves would stalemate instead!
escape-the-check:
  title: Escape the Check
  goal: Help your king escape check 10 times — by moving, blocking, or capturing!
escape-the-check-r1: Your king is in check from the rook. Tap every square where it is safe.
escape-the-check-r2: Your king is in check from the bishop. Tap every square where it is safe.
escape-the-check-r3: Your king is in check from the rook. Tap every safe square for it.
escape-the-check-r4: Your king is in check from a bishop far away. Tap every safe square for it.
escape-the-check-r5: A knight's check can never be blocked! Move your king to safety.
escape-the-check-r6: Move your king out of check.
escape-the-check-r7: Block the check! Move your bishop between your king and the rook.
escape-the-check-r8: Block the check! Move your rook between your king and the bishop.
escape-the-check-r9: Capture the checking knight with your pawn!
escape-the-check-r10: The rook giving check isn't guarded. Capture it with your king!
mate-hunt:
  title: Mate in 1
  goal: Find checkmate in one move, ten times in a row!
mate-hunt-r1: Checkmate in one! The black king is trapped by his own pawns.
mate-hunt-r2: Checkmate in one! Find the move along the open file.
mate-hunt-r3: Checkmate in one! Your king guards the checking square.
mate-hunt-r4: Checkmate in one! Your king guards the checking square.
mate-hunt-r5: Checkmate in one! Two rooks work together.
mate-hunt-r6: Checkmate in one! One rook cuts off the rank.
mate-hunt-r7: Checkmate in one! Your king guards the flight squares.
mate-hunt-r8: Checkmate in one! The black king is trapped by his own pawns.
mate-hunt-r9: Checkmate in one! Your king guards your queen's checking square.
mate-hunt-r10: Checkmate in one! Your king guards the checking square.
first-game:
  title: Your First Full Game!
  goal: Play a whole game against Mouse. Checkmate him to win — good luck!
castling:
  title: 'Castling: King and Rook Swap'
  story: >-
    Castling is a special move! The king and a rook move together: the king jumps two squares
    toward a rook that hasn't moved yet, and that rook hops right over to stand beside him. It's
    the only time two pieces move in one turn!
  demo: Try it! Move your king two squares toward a rook to castle.
castling-g1: Your king and the kingside rook haven't moved, and nothing stands between them. Can your king castle kingside right now?
castling-g2: Castle kingside! Move your king two squares to swap places with the rook.
castling-01: Your king and the queenside rook are both still home, with a clear path between them. Can your king castle queenside right now?
castling-02: The kingside rook already moved away from the corner. Can your king castle kingside right now?
castling-03: A black rook is giving your king check! Can your king castle kingside right now?
castling-04: A knight stands between your king and the kingside rook. Can your king castle kingside right now?
castling-05: A black bishop watches the square right next to your king. Can your king castle queenside right now?
castling-06: Only the queenside rook is still home. Castle queenside!
castling-07: Only the kingside rook is still home. Castle kingside!
castling-08: Both rooks are still home! Castle with either one.
en-passant:
  title: 'En Passant: Catch It "In Passing"'
  story: >-
    Sometimes a pawn rushes two squares on its very first move, right past an enemy pawn standing
    beside it. That's not quite fair — so, just this once, the enemy pawn may capture it anyway,
    as if it had only moved one square. This is called "en passant" (French for "in passing"), and
    it only works right away, the very next move.
  demo: Black's pawn just rushed two squares past yours. Capture it en passant, right now!
en-passant-g1: Black's pawn just rushed two squares and landed beside yours. Capture it en passant!
en-passant-g2: Black's pawn just rushed two squares past your pawn on c5. Can you capture it en passant right now?
en-passant-01: Black's pawn just rushed two squares past yours. Capture it en passant!
en-passant-02: Black's pawn just rushed two squares past yours. Capture it en passant!
en-passant-03: Two of your pawns could catch this one — either capture works!
en-passant-04: Black's pawn just rushed two squares past your pawn on h5. Can you capture it en passant right now?
en-passant-05: Black's last move was the king, not the pawn. Can your pawn on d5 capture the e5 pawn en passant right now?
draws:
  title: 'Draws: Nobody Wins'
  story: >-
    Some games end in a draw — nobody wins! Stalemate is one way: no legal move, but not in
    check. A game is also a draw when there isn't enough material left to checkmate (like a
    lone king against a lone king), if the exact same position happens three times in a row,
    or if 50 moves pass with no capture and no pawn move.
  demo: The black king has no legal move, and he isn't in check. That's stalemate — a draw!
draws-g1: "The black king has no legal move, and he isn't in check. Is he stalemated?"
draws-g2: 'Only two lone kings are left on the board. Stalemate, not enough material — or not a draw at all?'
draws-01: "The black king has no legal move, and he isn't in check. Is he stalemated?"
draws-02: A king and knight can never checkmate a lone king. Is this a draw by insufficient material?
draws-03: "It's Black's turn. Stalemate, not enough material — or not a draw at all?"
draws-04: 'Look at every piece on the board. Stalemate, not enough material — or not a draw at all?'
draws-05: "It's White's turn. Stalemate, not enough material — or not a draw at all?"
