rook:
  title: Meet Rhino the Rook
  story: >-
    Rhino loves charging straight ahead! He runs up, down, left, or right, as far
    as he wants. He can never jump over another piece.
  demo: Watch Rhino run to every green dot. Straight lines, any distance!
rook-g1: Move Rhino straight up to the star.
rook-g2: Move Rhino straight across to the star.
rook-01: Help Rhino grab both stars in the corners.
rook-02: Collect every star. Plan Rhino's path first!
rook-03: Tap every square Rhino can reach from here.
rook-04: A rock blocks the way! Find another path to the star.
rook-05: Rhino is hungry. Gobble up the pawn!
rook-06: A friend blocks one line, a pawn waits on another. Tap every square Rhino can reach.
rook-07: Three pawns, three captures. Get them all!
rook-08: Rhino's biggest challenge yet. Collect every star around the rock.
rook-04-easy: A rock blocks the way! Go around it to reach the star.
rook-08-easy: Collect both stars. The rock is in the way!
hungry-rook:
  title: Hungry Rook
  goal: Rhino is starving! Capture every piece before the moves run out.
bishop:
  title: Meet Elephant the Bishop
  story: >-
    Elephant only walks on diagonal paths, but he can go as far as he likes! Long ago people even
    called this piece "the Elephant." He always stays on squares of one colour.
  demo: Watch Elephant walk to every green dot. Diagonal paths, any distance!
bishop-g1: Move Elephant diagonally to the star.
bishop-g2: Move Elephant the other diagonal way to the star.
bishop-01: Help Elephant grab both stars, corner to corner.
bishop-02: Collect every star. Plan Elephant's diagonal path first!
bishop-03: Elephant only visits squares of one colour. Can Elephant reach the star?
bishop-04: Tap every square Elephant can reach. Look — they're all the same colour!
bishop-05: A rock blocks the diagonal! Find another way to the star.
bishop-06: Elephant is hungry. Gobble up the pawn!
bishop-07: A rock blocks one path, a pawn waits on another. Tap every square Elephant can reach.
bishop-08: Elephant's biggest challenge yet. Capture all four pawns.
hungry-bishop:
  title: Hungry Bishop
  goal: Elephant is starving! Capture every piece before the moves run out.
queen:
  title: Meet Lioness the Queen
  story: >-
    Lioness combines Rhino's straight charges and Elephant's diagonal paths. She is the strongest
    hunter on the board!
  demo: Watch Lioness run to every green dot. Straight lines and diagonals, any distance!
queen-g1: Move Lioness straight up to the star.
queen-g2: Move Lioness straight across to the star.
queen-01: Help Lioness grab both stars in the corners.
queen-02: One swift diagonal move reaches the far star!
queen-03: Tap every square Lioness can reach from here.
queen-04: A rock blocks the way! Find another path to the star.
queen-05: Lioness is hungry. Gobble up the pawn!
queen-06: A friend blocks one line, a pawn waits on another. Tap every square Lioness can reach.
queen-07: Three pawns, three captures. Get them all!
queen-08: Lioness's biggest challenge yet. Collect every star around the rock.
hungry-queen:
  title: Hungry Queen
  goal: Lioness is starving! Capture every piece before the moves run out.
king:
  title: Meet Lion the King
  story: >-
    Lion is the most important piece of all! He only steps one square at a time, in any direction,
    and he must always stay safe.
  demo: Watch Lion take one careful step in every direction.
king-g1: Move Lion one step up to the star.
king-g2: Move Lion one step to the star.
king-01: Walk Lion to the star, one step at a time.
king-02: Tap every square Lion can step to.
king-03: A pawn is watching a square! Find a safe path to the star.
king-04: Tap only the squares where Lion is safe.
king-05: A pawn blocks the direct path. Find the safe way to the star.
king-06: Lion's longest walk yet. Stay safe all the way to the star.
king-walk:
  title: King Walk
  goal: Lion must reach both stars, one careful step at a time, always staying safe.
knight:
  title: Meet Horse the Knight
  story: >-
    Horse jumps in an L shape: two squares one way, then one more to the side. He can jump right
    over anyone standing in between!
  demo: Watch Horse jump to every green dot. Always an L shape!
knight-g1: Jump Horse to the star.
knight-g2: Jump Horse to the star.
knight-01: Jump Horse to the star.
knight-02: Rocks are in the way, but Horse jumps right over them!
knight-03: Tap every square Horse can jump to.
knight-04: Horse is hungry. Gobble up the pawn!
knight-05: A rock blocks one landing spot. Tap every square Horse can jump to.
knight-06: Horse is boxed in by rocks, but a knight jumps right over them!
knight-07: Two jumps, two captures. Get them both!
knight-08: Collect both stars. Plan Horse's jumps!
knight-maze:
  title: Knight Maze
  goal: Horse must collect every star by jumping over the rocks!
pawn:
  title: Meet Caterpillar the Pawn
  story: >-
    Caterpillar only creeps straight ahead, never sideways or back. On her very first move she can
    creep one square or two — after that, always just one. To capture, she steps diagonally
    forward instead, never straight ahead.
  demo: Watch Caterpillar creep forward. On her very first step she can go one square or two!
pawn-g1: Creep Caterpillar forward, one square, to the star.
pawn-g2: On her very first move, Caterpillar can creep two squares. Reach the star!
pawn-01: Creep Caterpillar to the star. Her first move can go one square or two!
pawn-02: Caterpillar already made her first move. Now she creeps one square at a time. Reach the star.
pawn-03: Something blocks Caterpillar's path straight ahead. Tap every square she can still reach.
pawn-04: Caterpillar can only capture on a diagonal, never straight ahead. Find the piece she can capture.
pawn-05: Caterpillar is blocked straight ahead, but she can still capture on either diagonal. Tap every square she can reach.
pawn-06: A piece waits on the diagonal. Capture it, then keep creeping to the star!
pawn-07: Two pieces stand in Caterpillar's way. Creep closer, then capture them both!
pawn-08: Collect the first star, then find a way around the blocker to reach the second!
pawn-wars-4:
  title: Pawn Wars Jr.
  goal: Four caterpillars each! Be the first to transform into a queen, or capture every enemy.
promotion:
  title: Caterpillar Transforms!
  story: >-
    At the very last row, something amazing happens: Caterpillar transforms into a brand-new
    piece! She can become a queen, a rook, a bishop, or a knight — the powerful queen is almost
    always the best choice.
  demo: Watch Caterpillar creep all the way to the last row. There, she transforms!
promotion-g1: One more step and Caterpillar transforms! Move her to the last row.
promotion-g2: Caterpillar is about to transform! Which piece should she become?
promotion-01: One more step and Caterpillar transforms! Move her to the last row.
promotion-02: Caterpillar is about to transform! Which piece should she become?
promotion-03: A knight blocks the square ahead, but Caterpillar can capture her way to the last row. Find the winning move!
promotion-04: Tap every square where Caterpillar could transform this move.
promotion-05: Look at Caterpillar. Is she about to transform into a new piece?
pawn-wars:
  title: Pawn Wars
  goal: Eight caterpillars each! Race to transform first, or capture every piece.
squares:
  title: Meet the Squares
  story: >-
    Every chessboard is a checkerboard: light squares and dark squares, side by side. Here's Owl's
    favourite trick — the corner near your right hand is always light!
  demo: Look at your two corners. The one near your right hand is light. The one near your left hand is dark.
squares-g1: Your king is standing in your right-hand corner. Is that square light?
squares-g2: Now he hopped to your left-hand corner. Is that square light?
squares-01: Now he went to the far corner on your right. Is that square light?
squares-02: He hopped all the way to the far corner on your left. Is that square light?
squares-03: Now he's out in the middle of the board. Is his square light?
squares-04: Tap every light square in the row closest to you.
squares-05: Now tap every dark square in that same row.
lines:
  title: Rows, Columns, and Diagonals
  story: >-
    A row runs from side to side, a column runs from you to Owl, and a diagonal runs corner to
    corner. Every line is straight, and every square on it belongs together!
  demo: See this whole row, edge to edge? Every square on it is part of the same line.
lines-g1: Tap every square in the same row as your king.
lines-g2: Tap every square in the same column as your king.
lines-01: Tap every square in your king's row.
lines-02: This time, tap every square in your king's column.
lines-03: Your king moved closer to you. Tap his whole row.
lines-04: Tap every square in your king's column, all the way across the board.
lines-05: This line runs corner to corner. Tap every square on your king's diagonal.
lines-06: Here's the other diagonal. Tap every square your king shares with it.
square-hunt:
  title: Square Hunt
  goal: Tap every square in each highlighted line, as fast as you can!
square-hunt-r1: Tap every square in your king's row.
square-hunt-r2: Tap every square in your king's column.
square-hunt-r3: Tap every square in your king's row.
square-hunt-r4: Tap every square in your king's column.
square-hunt-r5: Tap every square on the long diagonal through your king, from corner to corner.
square-hunt-r6: Now the other long diagonal through your king. Tap it from corner to corner.
setup:
  title: Setting Up the Board
  story: >-
    Every game starts the same way. Rooks stand in the corners, knights right beside them, then
    bishops, and the queen and king share the middle. Pawns line up in front to protect them all.
  demo: Here is the whole starting line-up, ready to play.
setup-g1: "Let's start easy. Place the king on the dark square in the middle of the back row."
setup-g2: Now put the queen right next to him, on his left side.
setup-01: Place both rooks in their corners.
setup-02: Now add the knights, right next to the rooks.
setup-03: Next come the bishops, next to the knights.
setup-04: >-
  Finally the queen and king share the middle. Remember: the queen always stands on a square of
  her own colour!
setup-05: All that's left is the pawns — line up all eight, standing guard in front.
setup-race:
  title: Setup Race
  goal: Race to place every piece in its starting spot!
setup-race-r1: Place every piece on the back row, all in their starting spots.
setup-race-r2: Now add all eight pawns, standing guard in front.
attack:
  title: What Does It Attack?
  story: >-
    A piece "attacks" every square it could capture on right now, even the empty ones! Before you
    move, Owl wants you to spot every attack on the board.
  demo: Watch Caterpillar the Pawn. She attacks both diagonal squares in front of her!
attack-g1: Tap every square Caterpillar the Pawn attacks.
attack-g2: 'Horse wants to attack the bishop on d4. Which move lets him attack it?'
attack-01: Tap every square Caterpillar the Pawn attacks — the knight and the bishop are both there.
attack-02: 'Horse jumps in an L. Tap every square he attacks from d4 — some are empty, some have pieces!'
attack-03: Rhino attacks in straight lines. Tap every square he attacks from d1.
attack-04: Move Horse so he attacks the bishop on c4.
attack-05: Move Rhino so he attacks the knight on d4.
attack-06: Move Elephant so he attacks the knight on a5.
attack-07: 'Horse has more than one jump. Which move attacks the rook on b5?'
attack-08: Lioness is very powerful. Find a move that attacks the knight on f6.
defend:
  title: Defend Your Pieces
  story: >-
    When an enemy attacks your piece, you can move it away, bring a friend to guard it, block the
    attack, or capture the attacker. Owl calls all of these "defending"!
  demo: Rhino is coming for Horse! Horse can hop away to safety, or a friend could guard him.
defend-g1: 'Is Horse defended by the pawn on c3?'
defend-g2: Rhino is coming for Horse! Move Horse to safety.
defend-01: 'Is the knight on d5 defended?'
defend-02: 'A pawn now guards d5. Is the knight defended?'
defend-03: 'Rhino (black) is attacking Horse. Is Horse defended by the white rook on d2?'
defend-04: Rhino (black) is coming for Horse on b5! Move Horse to safety.
defend-05: Horse (a1) is trapped and Rhino is attacking him! Move Elephant so he guards Horse.
defend-06: Horse (a1) still can't move. Save him — block the attack, or capture the attacking rook!
defend-07: Rhino (black) is attacking Elephant. Move Elephant to safety.
defend-08: The bishop on c3 is attacking Rhino! Move Horse to capture it.
safe-pieces:
  title: Safe or Not?
  story: >-
    A piece is "hanging" when it is attacked and nothing protects it — the enemy could take it for
    free! Owl's #1 safety habit is always asking, "Is my piece safe?"
  demo: Look at Horse. Rhino attacks him and nothing guards him — Horse is hanging!
safe-pieces-g1: 'Is Horse hanging?'
safe-pieces-g2: Caterpillar (black) is undefended. Capture her for free!
safe-pieces-01: 'The bishop (black) attacks Horse and nothing guards him. Is Horse hanging?'
safe-pieces-02: 'A pawn now guards Horse. Is he still hanging?'
safe-pieces-03: 'Nothing attacks Elephant. Is he hanging?'
safe-pieces-04: 'The knight (black) attacks Caterpillar and nothing guards her. Is she hanging?'
safe-pieces-05: 'The rook (black) attacks Rhino on a4, but your other rook guards him. Is he hanging?'
safe-pieces-06: 'The knight (black) attacks Lioness and nothing guards her. Is she hanging?'
safe-pieces-07: The bishop (black) is undefended. Capture it for free with Lioness!
safe-pieces-08: Two pawns (black) are waiting. Only one is undefended — capture that one for free!
safe-pieces-09: Two pieces (black) are undefended. Find a move that captures one for free.
safe-pieces-10: One rook (black) is undefended, the other is guarded. Capture the free one!
piece-values:
  title: How Much Is Each Piece Worth?
  story: >-
    Every piece has a value: Caterpillar is worth 1, Horse and Elephant are worth 3, Rhino is worth
    5, and Lioness is worth a mighty 9! Knowing this helps you decide if a trade is worth it.
  demo: 'Here they are in order: Caterpillar 1, Horse or Elephant 3, Rhino 5, Lioness 9.'
piece-values-g1: 'Which is worth more: the pawn or the rook?'
piece-values-g2: 'Which is worth more: the knight or the queen?'
piece-values-01: 'Which is worth more: the pawn or the knight?'
piece-values-02: 'Which is worth more: the bishop or the rook?'
piece-values-03: 'Which is worth more: the rook or the queen?'
piece-values-04: Which piece is worth exactly 5?
piece-values-05: Which piece is worth exactly 9?
piece-values-06: Which piece is worth exactly 1?
trades:
  title: Good Trade or Bad Trade?
  story: >-
    Before you capture, ask what you give up and what you get. Taking a bigger piece, or an
    undefended one, is good — losing more than you gain is bad!
  demo: Rhino captures the queen! He gives up a rook (worth 5) to win a queen (worth 9) — a great trade!
trade-good: Good trade
trade-equal: Equal trade
trade-bad: Bad trade
trades-g1: 'Rhino captures the queen on h1. Is this trade good, equal, or bad?'
trades-g2: The knight (black) is undefended. Capture it with Elephant — a free piece is always a good trade!
trades-01: 'Horse captures the rook on d5, even though a pawn guards it. Good, equal, or bad trade?'
trades-02: 'The pawn on h1 is guarded by a knight. If Rhino captures it, good, equal, or bad trade?'
trades-03: 'The rook on h1 is guarded by a knight. If Rhino captures it, good, equal, or bad trade?'
trades-04: 'The pawn on f4 is undefended. If Elephant captures it, good, equal, or bad trade?'
trades-05: 'The pawn on c3 is guarded by another pawn. If Horse captures it, good, equal, or bad trade?'
trades-06: 'The knight on c3 is guarded by a pawn. If Horse captures it, good, equal, or bad trade?'
trades-07: 'Find the good trade: capture a piece worth more than Rhino.'
trades-08: Elephant can capture two different pieces. Find a good trade.
queen-vs-pawns:
  title: Queen vs Pawns
  goal: Lioness must capture every caterpillar before one of them transforms!
army-battle:
  title: Army Battle
  goal: Pawns and knights on both sides! Capture every enemy piece, or be first to transform.
win-the-queen:
  title: Win the Queen
  goal: No kings today — the first side to capture the enemy queen wins!
safe-or-not:
  title: Safe or Not?
  goal: 'Ten pieces, ten questions: is each one safe, or in danger?'
safe-or-not-r1: 'Is the bishop on e4 in danger?'
safe-or-not-r2: 'A pawn now guards the bishop on e4. Is it in danger?'
safe-or-not-r3: 'Nothing attacks the knight on h4. Is it in danger?'
safe-or-not-r4: 'Is the pawn on a7 in danger?'
safe-or-not-r5: 'A rook now guards the pawn on a7. Is it in danger?'
safe-or-not-r6: 'Is the knight on d4 in danger?'
safe-or-not-r7: 'A pawn now guards the knight on d4. Is it in danger?'
safe-or-not-r8: 'Is the rook on a1 in danger?'
safe-or-not-r9: 'A bishop now blocks the attack on a1. Is the rook in danger?'
safe-or-not-r10: 'Is the queen on f4 in danger?'
check:
  title: What Is Check?
  story: >-
    When a king is attacked, that's CHECK — danger! Lion must get to safety right away.
    Owl will teach you to spot it, and how to give check yourself.
  demo: A check! The black rook attacks Lion along the open file.
check-g1: 'Is Lion in check from the black rook?'
check-g2: 'Rhino can give check! Find the move that attacks the black king.'
check-01: 'A black bishop attacks Lion along the diagonal. Is Lion in check?'
check-02: 'Caterpillar now blocks the diagonal. Is Lion in check?'
check-03: A black knight jumps into position to attack Lion. Is Lion in check?
check-04: 'A black rook sits on a different line, far from Lion. Is Lion in check?'
check-05: Move Rhino so he gives check to the black king.
check-06: Move Elephant so he gives check to the black king.
check-07: Lioness can check the black king in several ways. Find one!
check-08: Move Horse so he gives check to the black king.
escape-check:
  title: Escape the Check!
  story: >-
    When Lion is in check, there are 3 ways out: move him to safety, block the attack, or
    capture the attacker. Let's practise all three!
  demo: Lion is in check. Every green dot is a square where he'd be safe.
escape-check-g1: 'Lion is in check! Tap every square where he can escape.'
escape-check-g2: The only way out is to move Lion — find a safe square.
escape-check-01: 'Lion is in check from the rook. Tap every square where he is safe.'
escape-check-02: 'Lion is in check from the bishop. Tap every square where he is safe.'
escape-check-03: 'Lion is in check from the rook. Tap every safe square for him.'
escape-check-04: 'Lion is in check from a bishop far away. Tap every safe square for him.'
escape-check-05: A knight's check can never be blocked! Move Lion to safety.
escape-check-06: Move Lion out of check — nothing can block or capture this rook here.
escape-check-07: Block the check! Move Elephant between Lion and the rook.
escape-check-08: Block the check! Move Rhino between Lion and the bishop.
escape-check-09: Capture the checking knight!
escape-check-10: The bishop giving check isn't guarded. Capture it with Lion!
checkmate:
  title: Check or Checkmate?
  story: >-
    Checkmate means the king is in check AND has no way out at all — no move, no block, no
    capture. The game is won!
  demo: Checkmate! Lioness checks the king, and every square around him is covered.
checkmate-g1: 'Is the black king checkmated?'
checkmate-g2: 'Is the black king checkmated? Look for an escape.'
checkmate-01: 'The white rook checks along the back row. Is the black king checkmated?'
checkmate-02: 'The white rook checks along the back row, but there is a gap. Is the black king checkmated?'
checkmate-03: 'Two white rooks trap the black king. Is he checkmated?'
checkmate-04: 'One white rook checks the black king. Is he checkmated?'
checkmate-05: 'The white queen and king work together. Is the black king checkmated?'
checkmate-06: 'A white rook checks the black king from far away. Is he checkmated?'
checkmate-07: 'The white queen checks, guarded by her king. Is the black king checkmated?'
checkmate-08: 'The white queen checks, but nothing guards her. Is the black king checkmated?'
mate-in-1:
  title: Mate in 1
  story: >-
    Owl challenges you to deliver CHECKMATE in just one move! Look for a move that traps
    the king completely.
  demo: Checkmate in one! Rhino delivers check along the open file.
mate-in-1-g1: Find the checkmate in one move — check Rhino's path to the back row.
mate-in-1-g2: Find the checkmate in one move — Lioness and Lion work together.
mate-in-1-01: Checkmate in one! The black king is trapped by his own pawns.
mate-in-1-02: Checkmate in one! Find the move along the open file.
mate-in-1-03: Checkmate in one! Lioness can reach the back row.
mate-in-1-04: Checkmate in one! Lioness and Lion team up.
mate-in-1-05: Checkmate in one! Move Lioness right next to the black king.
mate-in-1-06: Checkmate in one! Lion guards Lioness's checking square.
mate-in-1-07: Checkmate in one! Two rooks trap the black king together.
mate-in-1-08: Checkmate in one! One rook cuts off the escape, the other delivers check.
mate-in-1-09: Checkmate in one! Lion guards the squares Rhino can't reach.
mate-in-1-10: Checkmate in one! Lion and Rhino trap the black king in the corner.
mate-in-1-11: Checkmate in one! Horse guards the squares for Lioness.
mate-in-1-12: Checkmate in one! Horse and Caterpillar guard the king's escape.
stalemate:
  title: Watch Out for Stalemate!
  story: >-
    Stalemate is tricky: the king has no legal move at all, but he isn't in check. That's
    not a win — it's a draw! Always check before you play the "obvious" move.
  demo: Careful! The black king has no move and isn't in check — that's stalemate, a draw.
stalemate-g1: 'Is the black king stalemated?'
stalemate-g2: Find the checkmate in one move.
stalemate-01: 'The black king has no moves, and he is not in check. Is he stalemated?'
stalemate-02: 'The black king has no moves, and he is not in check. Is he stalemated?'
stalemate-03: 'The black king has plenty of moves. Is he stalemated?'
stalemate-04: 'The black king is in check, but he can escape. Is he stalemated?'
stalemate-05: Checkmate in one — but careful, some moves would stalemate instead!
stalemate-06: Checkmate in one — but careful, some moves would stalemate instead!
escape-the-check:
  title: Escape the Check
  goal: Help Lion escape check 10 times — by moving, blocking, or capturing!
escape-the-check-r1: 'Lion is in check from the rook. Tap every square where he is safe.'
escape-the-check-r2: 'Lion is in check from the bishop. Tap every square where he is safe.'
escape-the-check-r3: 'Lion is in check from the rook. Tap every safe square for him.'
escape-the-check-r4: 'Lion is in check from a bishop far away. Tap every safe square for him.'
escape-the-check-r5: A knight's check can never be blocked! Move Lion to safety.
escape-the-check-r6: Move Lion out of check.
escape-the-check-r7: Block the check! Move Elephant between Lion and the rook.
escape-the-check-r8: Block the check! Move Rhino between Lion and the bishop.
escape-the-check-r9: Capture the checking knight with Caterpillar!
escape-the-check-r10: The rook giving check isn't guarded. Capture it with Lion!
mate-hunt:
  title: Mate in 1
  goal: Find checkmate in one move, ten times in a row!
mate-hunt-r1: Checkmate in one! The black king is trapped by his own pawns.
mate-hunt-r2: Checkmate in one! Find the move along the open file.
mate-hunt-r3: Checkmate in one! Lion guards the checking square.
mate-hunt-r4: Checkmate in one! Lion guards the checking square.
mate-hunt-r5: Checkmate in one! Two rooks work together.
mate-hunt-r6: Checkmate in one! One rook cuts off the rank.
mate-hunt-r7: Checkmate in one! Lion guards the flight squares.
mate-hunt-r8: Checkmate in one! The black king is trapped by his own pawns.
mate-hunt-r9: Checkmate in one! Lion guards Lioness's checking square.
mate-hunt-r10: Checkmate in one! Lion guards the checking square.
first-game:
  title: Your First Full Game!
  goal: Play a whole game against Mouse. Checkmate him to win — good luck!
