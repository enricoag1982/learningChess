  privacy-nav: Privacy
  version: 'Version {{version}}'
  privacy:
    title: Privacy
    intro: Chess for Kids keeps everything on this device. Here's exactly what that means.
    data-heading: What we keep
    data-body: A nickname, an avatar picture, and lesson progress for each child — stored only on this device, never sent anywhere.
    no-accounts-heading: No accounts, no tracking
    no-accounts-body: No sign-up, no analytics, no ads, no third-party services. The app never phones home.
    network-heading: Network use
    network-body: The only network access is checking for app updates. Updates are static files delivered from GitHub Pages.
    control-heading: Parent control
    control-body: Export or delete any child's data any time, from Backup and from that child's Settings in the parent area.
    contact-heading: Questions?
    contact-body: "Open an issue on the project's GitHub repository: {{url}}"
    close: Close
voice-check:
  # Parent area "Test voice" (M6.3 item 2): the one fixed sentence it speaks. Deliberately its own
  # top-level key, not under `parent:` — every `parent.*`/`new-player.*`/`backup.*`/`privacy.*` key
  # is grown-up-only and never narrated (`voice-texts.ts`'s `EXCLUDED_KEY_PREFIXES`), but this text
  # must be in the voice inventory to actually test the recorded voice.
  sentence: Let's play chess together!
